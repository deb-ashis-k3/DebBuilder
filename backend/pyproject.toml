[project]
name = "debbuilder-backend"
version = "0.1.0"
description = "DebBuilder API: n8n-style workflow engine on LangChain + LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.1",
    "aiokafka>=0.15.0",
    "aiomqtt>=2.5.1",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-core>=1.7.1",
    "langchain-google-genai>=4.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "livekit-api>=1.2.2",
    "nats-py>=2.16.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
voice = [
    "livekit-agents[cartesia,deepgram,elevenlabs,openai,silero]>=1.8.10",
]

[tool.uv]
package = false
